<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>İnternet Yok - Kite Göktaşı Avcısı</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: #08090f;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    
    #game-container {
      position: relative;
      width: 100%;
      max-width: 680px;
      height: 440px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 35px rgba(127, 0, 255, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: #0b0d17;
      touch-action: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .header-info {
      text-align: center;
      margin-bottom: 12px;
      padding: 0 16px;
    }
    .offline-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .title {
      font-size: 22px;
      font-weight: 800;
      background: linear-gradient(135deg, #fff 0%, #a78bfa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 13px;
      color: #94a3b8;
    }
    .controls-hint {
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: #64748b;
    }
    .key-badge {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #e2e8f0;
      padding: 2px 8px;
      border-radius: 6px;
      font-family: monospace;
      font-weight: 700;
    }
    .btn-retry {
      margin-top: 14px;
      background: linear-gradient(135deg, #7f00ff, #00f0ff);
      border: none;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      padding: 9px 22px;
      border-radius: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 16px rgba(127, 0, 255, 0.3);
    }
    .btn-retry:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 240, 255, 0.4);
    }
  </style>
</head>
<body>

  <div class="header-info">
    <div class="offline-badge">
      <span>📡</span> İnternet Bağlantısı Yok
    </div>
    <h1 class="title">LowBrowser: Siber Göktaşı Avcısı</h1>
    <p class="subtitle" id="fail-url-text">İnternet bağlantınız gelene kadar uzay geminizle göktaşlarını yok edin!</p>
  </div>

  <div id="game-container">
    <canvas id="gameCanvas" width="680" height="440"></canvas>
  </div>

  <div class="controls-hint">
    <span>Hareket:</span>
    <span class="key-badge">← → / A-D veya Fare</span>
    <span>Ateş:</span>
    <span class="key-badge">Boşluk (Space) / Tıkla</span>
  </div>

  <button class="btn-retry" id="btn-retry-connection">
    <span>🔄</span> Sayfayı Yeniden Yükle
  </button>

  <script>
    // Audio Synthesizer (Zero External Dependencies)
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function playSound(type) {
      try {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;
        if (type === 'laser') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(800, now);
          osc.frequency.exponentialRampToValueAtTime(150, now + 0.08);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
          osc.start(now);
          osc.stop(now + 0.08);
        } else if (type === 'explosion') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(140, now);
          osc.frequency.exponentialRampToValueAtTime(30, now + 0.25);
          gain.gain.setValueAtTime(0.35, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.25);
        } else if (type === 'powerup') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(350, now);
          osc.frequency.exponentialRampToValueAtTime(950, now + 0.22);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
          osc.start(now);
          osc.stop(now + 0.22);
        } else if (type === 'hit') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(90, now);
          osc.frequency.exponentialRampToValueAtTime(20, now + 0.4);
          gain.gain.setValueAtTime(0.5, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
          osc.start(now);
          osc.stop(now + 0.4);
        }
      } catch (e) {}
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let gameState = 'START'; // START, PLAYING, GAMEOVER
    let score = 0;
    let highScore = parseInt(localStorage.getItem('lb_asteroid_highscore') || '0');
    let frames = 0;
    let level = 1;

    // Player Spaceship
    const player = {
      x: canvas.width / 2,
      y: canvas.height - 45,
      width: 36,
      height: 32,
      speed: 7,
      shield: false,
      tripleLaser: false,
      tripleTimer: 0,
      shootCooldown: 0
    };

    // Game Entities
    let lasers = [];
    let asteroids = [];
    let particles = [];
    let powerups = [];
    let stars = [];

    // Keys State
    const keys = {
      left: false,
      right: false,
      shoot: false
    };

    // Init Stars
    for (let i = 0; i < 50; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 2 + 0.5,
        speed: Math.random() * 2 + 0.8
      });
    }

    function resetGame() {
      score = 0;
      frames = 0;
      level = 1;
      player.x = canvas.width / 2;
      player.shield = false;
      player.tripleLaser = false;
      player.tripleTimer = 0;
      lasers = [];
      asteroids = [];
      particles = [];
      powerups = [];
      gameState = 'PLAYING';
    }

    function shootLaser() {
      if (player.shootCooldown > 0) return;
      player.shootCooldown = 10;
      playSound('laser');

      if (player.tripleLaser) {
        lasers.push({ x: player.x, y: player.y - 14, vx: 0, vy: -10 });
        lasers.push({ x: player.x - 10, y: player.y - 10, vx: -2.5, vy: -9.5 });
        lasers.push({ x: player.x + 10, y: player.y - 10, vx: 2.5, vy: -9.5 });
      } else {
        lasers.push({ x: player.x - 7, y: player.y - 12, vx: 0, vy: -10 });
        lasers.push({ x: player.x + 7, y: player.y - 12, vx: 0, vy: -10 });
      }
    }

    // Input Events
    window.addEventListener('keydown', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
      if (e.code === 'Space') {
        e.preventDefault();
        if (gameState === 'START' || gameState === 'GAMEOVER') {
          resetGame();
        } else {
          keys.shoot = true;
        }
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
      if (e.code === 'Space') keys.shoot = false;
    });

    // Mouse / Touch Controls
    canvas.addEventListener('pointermove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const mouseX = (e.clientX - rect.left) * scaleX;
      player.x = Math.max(20, Math.min(canvas.width - 20, mouseX));
    });

    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (gameState === 'START' || gameState === 'GAMEOVER') {
        resetGame();
      } else {
        shootLaser();
        keys.shoot = true;
      }
    });

    canvas.addEventListener('pointerup', () => {
      keys.shoot = false;
    });

    document.getElementById('btn-retry-connection').addEventListener('click', () => {
      const origUrl = new URLSearchParams(window.location.search).get('target');
      if (origUrl) window.location.href = origUrl;
      else window.history.back();
    });

    const targetUrl = new URLSearchParams(window.location.search).get('target');
    if (targetUrl) {
      document.getElementById('fail-url-text').textContent = `"${targetUrl}" adresine ulaşılamıyor.`;
    }

    // Spawn Asteroid
    function spawnAsteroid(x, y, size = 'large', vx = null, vy = null) {
      let radius, hp, points, color;
      if (size === 'large') {
        radius = 28 + Math.random() * 8;
        hp = 3;
        points = 30;
        color = '#c084fc';
      } else if (size === 'medium') {
        radius = 18 + Math.random() * 4;
        hp = 2;
        points = 20;
        color = '#a855f7';
      } else {
        radius = 10 + Math.random() * 3;
        hp = 1;
        points = 10;
        color = '#7e22ce';
      }

      // Generate irregular polygon vertices for realistic asteroid shape
      const vertices = [];
      const numPoints = 8 + Math.floor(Math.random() * 4);
      for (let i = 0; i < numPoints; i++) {
        const angle = (i / numPoints) * Math.PI * 2;
        const dist = radius * (0.75 + Math.random() * 0.4);
        vertices.push({ x: Math.cos(angle) * dist, y: Math.sin(angle) * dist });
      }

      asteroids.push({
        x: x !== null ? x : Math.random() * (canvas.width - 60) + 30,
        y: y !== null ? y : -40,
        vx: vx !== null ? vx : (Math.random() * 2 - 1) * (1 + level * 0.1),
        vy: vy !== null ? vy : (Math.random() * 1.5 + 1.2) * (1 + level * 0.15),
        radius,
        hp,
        maxHp: hp,
        points,
        size,
        color,
        rot: 0,
        rotSpeed: (Math.random() * 0.04 - 0.02),
        vertices
      });
    }

    function createExplosion(x, y, color = '#a855f7', count = 18) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = Math.random() * 5 + 1;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd,
          size: Math.random() * 4 + 2,
          color: Math.random() > 0.4 ? color : (Math.random() > 0.5 ? '#00f0ff' : '#fbbf24'),
          life: 1
        });
      }
    }

    function triggerGameOver() {
      gameState = 'GAMEOVER';
      playSound('hit');
      createExplosion(player.x, player.y, '#00f0ff', 35);
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('lb_asteroid_highscore', highScore.toString());
      }
    }

    // Main Update Loop
    function update() {
      frames++;

      // Stars parallax
      stars.forEach(s => {
        s.y += s.speed;
        if (s.y > canvas.height) {
          s.y = 0;
          s.x = Math.random() * canvas.width;
        }
      });

      if (gameState === 'PLAYING') {
        level = 1 + Math.floor(score / 500);

        // Player Movement
        if (keys.left) player.x -= player.speed;
        if (keys.right) player.x += player.speed;
        player.x = Math.max(20, Math.min(canvas.width - 20, player.x));

        // Auto / Key Shoot
        if (player.shootCooldown > 0) player.shootCooldown--;
        if (keys.shoot) shootLaser();

        // Triple Laser Timer
        if (player.tripleLaser) {
          player.tripleTimer--;
          if (player.tripleTimer <= 0) player.tripleLaser = false;
        }

        // Spawn Asteroids based on Level
        const spawnRate = Math.max(45, 90 - level * 8);
        if (frames % spawnRate === 0) {
          spawnAsteroid(null, null, 'large');
        }

        // Update Lasers
        for (let i = lasers.length - 1; i >= 0; i--) {
          const l = lasers[i];
          l.x += l.vx;
          l.y += l.vy;
          if (l.y < -20 || l.x < 0 || l.x > canvas.width) {
            lasers.splice(i, 1);
          }
        }

        // Update Asteroids & Collisions
        for (let i = asteroids.length - 1; i >= 0; i--) {
          const a = asteroids[i];
          a.x += a.vx;
          a.y += a.vy;
          a.rot += a.rotSpeed;

          // Screen wrap/bounce horizontally
          if (a.x < a.radius || a.x > canvas.width - a.radius) a.vx *= -1;

          // Check Collision with Lasers
          for (let j = lasers.length - 1; j >= 0; j--) {
            const l = lasers[j];
            const dist = Math.hypot(l.x - a.x, l.y - a.y);
            if (dist < a.radius + 6) {
              lasers.splice(j, 1);
              a.hp--;
              createExplosion(l.x, l.y, '#00f0ff', 6);

              if (a.hp <= 0) {
                score += a.points;
                playSound('explosion');
                createExplosion(a.x, a.y, a.color, 16);

                // Split Asteroid into smaller pieces
                if (a.size === 'large') {
                  spawnAsteroid(a.x - 10, a.y, 'medium', -1.5, a.vy * 1.2);
                  spawnAsteroid(a.x + 10, a.y, 'medium', 1.5, a.vy * 1.2);
                } else if (a.size === 'medium') {
                  spawnAsteroid(a.x - 8, a.y, 'small', -2, a.vy * 1.4);
                  spawnAsteroid(a.x + 8, a.y, 'small', 2, a.vy * 1.4);
                }

                // Chance to drop power-up
                if (Math.random() > 0.88) {
                  const type = Math.random() > 0.5 ? 'triple' : 'shield';
                  powerups.push({ x: a.x, y: a.y, type, vy: 1.8, size: 14 });
                }

                asteroids.splice(i, 1);
                break;
              }
            }
          }

          // Check Collision with Player Ship
          const shipDist = Math.hypot(player.x - a.x, player.y - a.y);
          if (shipDist < a.radius + 16) {
            if (player.shield) {
              player.shield = false;
              playSound('hit');
              createExplosion(a.x, a.y, '#10b981', 20);
              asteroids.splice(i, 1);
              continue;
            } else {
              triggerGameOver();
              return;
            }
          }

          // Off bottom screen
          if (a.y > canvas.height + 50) {
            asteroids.splice(i, 1);
          }
        }

        // Update Powerups
        for (let i = powerups.length - 1; i >= 0; i--) {
          const p = powerups[i];
          p.y += p.vy;

          const pDist = Math.hypot(player.x - p.x, player.y - p.y);
          if (pDist < p.size + 18) {
            playSound('powerup');
            if (p.type === 'shield') {
              player.shield = true;
            } else if (p.type === 'triple') {
              player.tripleLaser = true;
              player.tripleTimer = 450; // ~7.5 seconds
            }
            score += 100;
            createExplosion(p.x, p.y, p.type === 'shield' ? '#10b981' : '#f59e0b', 12);
            powerups.splice(i, 1);
            continue;
          }

          if (p.y > canvas.height + 20) powerups.splice(i, 1);
        }
      }

      // Update Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.035;
        p.size *= 0.95;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    // Render Canvas
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. Grid Lines
      ctx.strokeStyle = 'rgba(127, 0, 255, 0.05)';
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }

      // 2. Stars
      stars.forEach(s => {
        ctx.fillStyle = `rgba(255, 255, 255, ${0.3 + Math.sin(frames * 0.06 + s.x) * 0.3})`;
        ctx.fillRect(s.x, s.y, s.size, s.size);
      });

      // 3. Lasers
      lasers.forEach(l => {
        ctx.save();
        ctx.fillStyle = '#00f0ff';
        ctx.shadowColor = '#00f0ff';
        ctx.shadowBlur = 10;
        ctx.fillRect(l.x - 2, l.y - 8, 4, 16);
        ctx.restore();
      });

      // 4. Asteroids
      asteroids.forEach(a => {
        ctx.save();
        ctx.translate(a.x, a.y);
        ctx.rotate(a.rot);

        // Asteroid Glow & Fill
        ctx.fillStyle = '#1e1035';
        ctx.strokeStyle = a.color;
        ctx.lineWidth = 2;
        ctx.shadowColor = a.color;
        ctx.shadowBlur = 8;

        ctx.beginPath();
        a.vertices.forEach((v, idx) => {
          if (idx === 0) ctx.moveTo(v.x, v.y);
          else ctx.lineTo(v.x, v.y);
        });
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Asteroid core details
        ctx.fillStyle = a.color;
        ctx.beginPath();
        ctx.arc(a.vertices[0].x * 0.4, a.vertices[0].y * 0.4, 3, 0, Math.PI * 2);
        ctx.arc(a.vertices[2].x * 0.3, a.vertices[2].y * 0.3, 2, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      });

      // 5. Powerups
      powerups.forEach(p => {
        ctx.save();
        ctx.translate(p.x, p.y);
        const col = p.type === 'shield' ? '#10b981' : '#f59e0b';
        ctx.fillStyle = col;
        ctx.shadowColor = col;
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.arc(0, 0, p.size, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#fff';
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(p.type === 'shield' ? '🛡️' : '⚡', 0, 0);
        ctx.restore();
      });

      // 6. Explosions & Particles
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;

      // 7. Player Spaceship
      if (gameState !== 'GAMEOVER') {
        ctx.save();
        ctx.translate(player.x, player.y);

        // Shield Bubble
        if (player.shield) {
          ctx.strokeStyle = '#10b981';
          ctx.lineWidth = 2.5;
          ctx.shadowColor = '#10b981';
          ctx.shadowBlur = 14;
          ctx.beginPath();
          ctx.arc(0, 0, 26, 0, Math.PI * 2);
          ctx.stroke();
          ctx.shadowBlur = 0;
        }

        // Engine Thruster Flame
        ctx.fillStyle = Math.random() > 0.5 ? '#00f0ff' : '#7f00ff';
        ctx.shadowColor = '#00f0ff';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.moveTo(-6, 14);
        ctx.lineTo(0, 22 + Math.random() * 8);
        ctx.lineTo(6, 14);
        ctx.closePath();
        ctx.fill();

        // Spaceship Wings & Body
        ctx.fillStyle = '#7f00ff';
        ctx.strokeStyle = '#00f0ff';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(0, -18); // Nose
        ctx.lineTo(16, 14); // Right Wing
        ctx.lineTo(6, 10);
        ctx.lineTo(0, 14);
        ctx.lineTo(-6, 10);
        ctx.lineTo(-16, 14); // Left Wing
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Cockpit
        ctx.fillStyle = '#00f0ff';
        ctx.beginPath();
        ctx.moveTo(0, -10);
        ctx.lineTo(3, -2);
        ctx.lineTo(0, 2);
        ctx.lineTo(-3, -2);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
      }

      // 8. HUD & Info
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 15px monospace';
      ctx.textAlign = 'left';
      ctx.fillText(`SKOR: ${score}`, 16, 28);
      ctx.fillText(`DALGA: ${level}`, 16, 48);

      ctx.fillStyle = '#a78bfa';
      ctx.textAlign = 'right';
      ctx.fillText(`REKOR: ${highScore}`, canvas.width - 16, 28);
      if (player.tripleLaser) {
        ctx.fillStyle = '#f59e0b';
        ctx.fillText(`ÜÇLÜ LAZER: ${Math.ceil(player.tripleTimer / 60)}s`, canvas.width - 16, 48);
      }

      // 9. Overlay Screens
      if (gameState === 'START') {
        ctx.fillStyle = 'rgba(11, 13, 23, 0.75)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#fff';
        ctx.font = '800 22px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('BAŞLAMAK İÇİN BOŞLUK VEYA DOKUN', canvas.width / 2, canvas.height / 2 - 12);

        ctx.font = '500 13px sans-serif';
        ctx.fillStyle = '#38bdf8';
        ctx.fillText('Uzay geminizi yönlendirin ve göktaşlarını vurun!', canvas.width / 2, canvas.height / 2 + 18);
      } else if (gameState === 'GAMEOVER') {
        ctx.fillStyle = 'rgba(11, 13, 23, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#ef4444';
        ctx.font = '800 26px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('💥 GEMİNİZ PARÇALANDI!', canvas.width / 2, canvas.height / 2 - 30);

        ctx.fillStyle = '#fff';
        ctx.font = 'bold 18px monospace';
        ctx.fillText(`TOPLAM SKOR: ${score}`, canvas.width / 2, canvas.height / 2 + 4);

        ctx.font = '500 13px sans-serif';
        ctx.fillStyle = '#38bdf8';
        ctx.fillText('Tekrar oynamak için Boşluk (Space) tuşuna basın veya dokunun', canvas.width / 2, canvas.height / 2 + 40);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
